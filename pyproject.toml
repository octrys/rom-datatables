[project]
name = "rom-datatables"
version = "0.1.0"
description = "Projects rom-tools' decoded ROM: Golden Age datatables into the rom-server datapack"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
explore = [
    "datasette>=0.65,<1.0",
]

[project.scripts]
rom-datatables = "rom_datatables.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rom_datatables"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# `uv run rom-datatables explore` works without extra flags.
default-groups = ["dev", "explore"]
